name: Olist Data Pipeline

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project requirements
        run: |
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: test-olist-data-pipeline
          workload_identity_provider: projects/807949064170/locations/global/workloadIdentityPools/github-actions/providers/github

      - name: Download Olist dataset
        run: |
          mkdir -p data
          curl -L \
            "https://www.kaggle.com/api/v1/datasets/download/olistbr/brazilian-ecommerce" \
            -o /tmp/olist.zip
          unzip -o /tmp/olist.zip -d data
          rm /tmp/olist.zip

      - name: Run Meltano ingestion
        working-directory: meltano_ingestion
        env:
          GOOGLE_CLOUD_PROJECT: test-olist-data-pipeline
          BIGQUERY_DATASET: olist_raw
        run: |
          meltano install
          meltano run tap-csv target-bigquery
          meltano run tap-rest-api-msdk target-bigquery

      - name: Create dbt profiles
        working-directory: dbt_transform
        run: |
          cat > profiles.yml <<'EOF'
          dbt_transform:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: oauth
                project: test-olist-data-pipeline
                dataset: olist_staging
                location: US
                threads: 4
          EOF

      - name: Run dbt
        working-directory: dbt_transform
        env:
          DBT_GCP_PROJECT: test-olist-data-pipeline
        run: |
          dbt deps
          dbt run --target prod

      - name: Test dbt
        working-directory: dbt_transform
        env:
          DBT_GCP_PROJECT: test-olist-data-pipeline
        run: |
          dbt test --target prod

      - name: Run Great Expectations
        env:
          GOOGLE_CLOUD_PROJECT: test-olist-data-pipeline
          GX_ENV: prod
          GX_DATA_LAYER: staging
          GX_SOURCE_MODE: bigquery
          GX_RAISE_ON_CRITICAL_FAILURE: "true"
          GX_RAISE_ON_MART_FAILURE: "true"
        run: |
          python -m scripts.run_gx_validation_gx