version: 2

models:
  - name: int_geolocation
    description: "Deduplicated geolocation records. Grain: one row per ZIP code prefix."
    columns:
      - name: geolocation_zip_code_prefix
        tests:
          - not_null
          - unique

  - name: int_order_items
    description: "Order item metrics. Grain: one row per order item."
    columns:
      - name: order_id
        tests:
          - not_null

      - name: order_item_id
        tests:
          - not_null

      - name: item_total_value
        tests:
          - not_null

  - name: int_order_payments
    description: "Aggregated payment metrics. Grain: one row per order."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: total_payment_value
        tests:
          - not_null

  - name: int_order_reviews
    description: "Aggregated review metrics. Grain: one row per order."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: average_review_score
        tests:
          - not_null

  - name: int_customer_orders
    description: "Customer order history. Grain: one row per order."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_unique_id
        tests:
          - not_null

      - name: customer_order_number
        description: "Sequence number among the customer's qualifying (non-canceled, non-unavailable) orders. NULL for canceled/unavailable orders."

      - name: is_qualifying_order
        description: "True unless the order is CANCELED or UNAVAILABLE. Drives customer_order_number and first_order_timestamp."
        tests:
          - not_null

  - name: int_orders
    description: "Order-level business metrics. Grain: one row per order."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null