version: 2

unit_tests:
  - name: test_dim_product_category_fallback
    description: "product_category_name_english falls back to the Portuguese name when no translation match exists, then to 'unknown' when the category itself is null."
    model: dim_product
    given:
      - input: ref('stg_products')
        rows:
          - product_id: "p_matched"
            product_category_name: "beleza_saude"
          - product_id: "p_unmatched"
            product_category_name: "categoria_inexistente"
          - product_id: "p_no_category"
            product_category_name: null
      - input: ref('stg_category_translation')
        rows:
          - product_category_name: "beleza_saude"
            product_category_name_english: "health_beauty"
    expect:
      rows:
        - product_id: "p_matched"
          product_category_name_english: "health_beauty"
        - product_id: "p_unmatched"
          product_category_name_english: "categoria_inexistente"
        - product_id: "p_no_category"
          product_category_name_english: "unknown"
